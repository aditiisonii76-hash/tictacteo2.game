<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Tic Tac Toe</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .cell-glow-x {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }
        .cell-glow-o {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .win-cell {
            animation: pulse-win 1s infinite alternate;
        }
        @keyframes pulse-win {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }
        #canvas-confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300" id="app-body">

    <canvas id="canvas-confetti"></canvas>

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 transition-colors duration-300" id="main-card">
        <!-- Header Controls -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black bg-gradient-to-r from-red-500 to-blue-500 bg-clip-text text-transparent">
                TIC TAC TOE
            </h1>
            <div class="flex items-center gap-2">
                <button id="btn-sound" class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 transition text-slate-300">
                    <i data-lucide="volume-2" class="w-5 h-5"></i>
                </button>
                <button id="btn-theme" class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 transition text-slate-300">
                    <i data-lucide="sun" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Mode & Grid Selectors -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Mode</label>
                <select id="select-mode" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                    <option value="pvp">2 Players (Local)</option>
                    <option value="ai-easy">Vs AI (Easy)</option>
                    <option value="ai-med">Vs AI (Medium)</option>
                    <option value="ai-hard" selected>Vs AI (Hard)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">Board Size</label>
                <select id="select-size" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                    <option value="3" selected>3 x 3 (Win: 3)</option>
                    <option value="4">4 x 4 (Win: 4)</option>
                    <option value="5">5 x 5 (Win: 4)</option>
                </select>
            </div>
        </div>

        <!-- Scoreboard -->
        <div class="flex justify-between items-center bg-slate-900/60 rounded-xl p-3 mb-6 border border-slate-700/50">
            <div class="text-center flex-1">
                <span class="text-xs text-slate-400 font-bold block">PLAYER X</span>
                <span id="score-x" class="text-2xl font-black text-red-500">0</span>
            </div>
            <div class="text-center px-2">
                <span class="text-xs text-slate-500 font-bold block">TIES</span>
                <span id="score-ties" class="text-lg font-bold text-slate-400">0</span>
            </div>
            <div class="text-center flex-1">
                <span class="text-xs text-slate-400 font-bold block" id="label-player-o">PLAYER O</span>
                <span id="score-o" class="text-2xl font-black text-blue-500">0</span>
            </div>
        </div>

        <!-- Status Message -->
        <div id="status-msg" class="text-center text-sm font-semibold mb-4 text-slate-300 min-h-[20px]">
            Player X's Turn
        </div>

        <!-- Game Board Container -->
        <div id="board" class="grid gap-2 aspect-square mb-6"></div>

        <!-- Action Buttons -->
        <div class="flex gap-3">
            <button id="btn-undo" class="flex-1 flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-600 active:scale-95 transition text-white font-medium p-2.5 rounded-xl border border-slate-600 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Undo
            </button>
            <button id="btn-restart" class="flex-1 flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition text-white font-medium p-2.5 rounded-xl shadow-lg shadow-indigo-600/30">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> Restart
            </button>
        </div>
    </div>

    <script>
        // --- Sound Engine (Web Audio API) ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            play(type) {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;

                if (type === 'x') {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'o') {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.exponentialRampToValueAtTime(293.66, now + 0.12);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.2);
                    });
                }
            }
        }
        const audio = new SoundEngine();

        // --- Confetti System ---
        const canvas = document.getElementById('canvas-confetti');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti() {
            particles = [];
            const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.7) * 12,
                    size: Math.random() * 6 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // Gravity
                p.life -= 0.015;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            particles = particles.filter(p => p.life > 0);
            if (particles.length > 0) {
                requestAnimationFrame(animateConfetti);
            }
        }

        // --- Game Logic ---
        let boardSize = 3;
        let winTarget = 3;
        let boardState = [];
        let currentPlayer = 'X';
        let gameActive = true;
        let history = [];
        let scores = { X: 0, O: 0, ties: 0 };
        let isDarkMode = true;

        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status-msg');
        const modeSelect = document.getElementById('select-mode');
        const sizeSelect = document.getElementById('select-size');
        const btnUndo = document.getElementById('btn-undo');
        const btnRestart = document.getElementById('btn-restart');
        const btnSound = document.getElementById('btn-sound');
        const btnTheme = document.getElementById('btn-theme');
        const labelPlayerO = document.getElementById('label-player-o');

        function initGame() {
            boardSize = parseInt(sizeSelect.value);
            winTarget = boardSize === 3 ? 3 : 4;
            boardState = Array(boardSize * boardSize).fill('');
            currentPlayer = 'X';
            gameActive = true;
            history = [];

            // UI Label updates
            const isAI = modeSelect.value.startsWith('ai');
            labelPlayerO.textContent = isAI ? 'BOT (O)' : 'PLAYER O';

            // Build dynamic grid CSS
            boardEl.style.gridTemplateColumns = `repeat(${boardSize}, minmax(0, 1fr))`;
            boardEl.innerHTML = '';

            for (let i = 0; i < boardSize * boardSize; i++) {
                const cell = document.createElement('button');
                cell.className = 'w-full h-full bg-slate-700/50 hover:bg-slate-700 rounded-xl flex items-center justify-center font-black text-3xl md:text-4xl transition-all duration-200 border border-slate-600/40 select-none';
                cell.dataset.index = i;
                cell.addEventListener('click', () => handleCellClick(i));
                boardEl.appendChild(cell);
            }

            statusEl.textContent = `Player X's Turn`;
            updateUndoBtn();
            lucide.createIcons();
        }

        function handleCellClick(index) {
            if (!gameActive || boardState[index] !== '') return;

            makeMove(index, currentPlayer);

            if (gameActive && modeSelect.value.startsWith('ai') && currentPlayer === 'O') {
                setTimeout(makeAIMove, 300);
            }
        }

        function makeMove(index, player) {
            boardState[index] = player;
            history.push({ board: [...boardState], player });

            audio.play(player.toLowerCase());
            renderBoard();

            const winInfo = checkWin(boardState, player);
            if (winInfo) {
                gameActive = false;
                highlightWin(winInfo.line);
                statusEl.textContent = `Player ${player} Wins! 🎉`;
                scores[player]++;
                updateScores();
                audio.play('win');
                triggerConfetti();
                updateUndoBtn();
                return;
            }

            if (boardState.every(c => c !== '')) {
                gameActive = false;
                statusEl.textContent = `It's a Draw! 🤝`;
                scores.ties++;
                updateScores();
                updateUndoBtn();
                return;
            }

            currentPlayer = player === 'X' ? 'O' : 'X';
            statusEl.textContent = modeSelect.value.startsWith('ai') && currentPlayer === 'O' 
                ? `Bot is thinking...` 
                : `Player ${currentPlayer}'s Turn`;
            updateUndoBtn();
        }

        function renderBoard() {
            const cells = boardEl.children;
            for (let i = 0; i < cells.length; i++) {
                const val = boardState[i];
                cells[i].innerHTML = '';
                cells[i].className = 'w-full h-full bg-slate-700/50 hover:bg-slate-700 rounded-xl flex items-center justify-center font-black text-3xl md:text-4xl transition-all duration-200 border border-slate-600/40 select-none';

                if (val === 'X') {
                    cells[i].innerHTML = `<i data-lucide="x" class="w-3/5 h-3/5 text-red-500"></i>`;
                    cells[i].classList.add('cell-glow-x');
                } else if (val === 'O') {
                    cells[i].innerHTML = `<i data-lucide="circle" class="w-3/5 h-3/5 text-blue-500"></i>`;
                    cells[i].classList.add('cell-glow-o');
                }
            }
            lucide.createIcons();
        }

        function highlightWin(line) {
            const cells = boardEl.children;
            line.forEach(idx => {
                cells[idx].classList.add('win-cell', 'bg-emerald-500/20', 'border-emerald-500');
            });
        }

        function checkWin(board, player) {
            const lines = generateWinLines();
            for (let line of lines) {
                if (line.every(idx => board[idx] === player)) {
                    return { winner: player, line };
                }
            }
            return null;
        }

        function generateWinLines() {
            const lines = [];
            // Rows
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c <= boardSize - winTarget; c++) {
                    const line = [];
                    for (let k = 0; k < winTarget; k++) line.push(r * boardSize + (c + k));
                    lines.push(line);
                }
            }
            // Columns
            for (let c = 0; c < boardSize; c++) {
                for (let r = 0; r <= boardSize - winTarget; r++) {
                    const line = [];
                    for (let k = 0; k < winTarget; k++) line.push((r + k) * boardSize + c);
                    lines.push(line);
                }
            }
            // Diagonals (\)
            for (let r = 0; r <= boardSize - winTarget; r++) {
                for (let c = 0; c <= boardSize - winTarget; c++) {
                    const line = [];
                    for (let k = 0; k < winTarget; k++) line.push((r + k) * boardSize + (c + k));
                    lines.push(line);
                }
            }
            // Anti-Diagonals (/)
            for (let r = 0; r <= boardSize - winTarget; r++) {
                for (let c = winTarget - 1; c < boardSize; c++) {
                    const line = [];
                    for (let k = 0; k < winTarget; k++) line.push((r + k) * boardSize + (c - k));
                    lines.push(line);
                }
            }
            return lines;
        }

        // --- AI Implementation ---
        function makeAIMove() {
            if (!gameActive) return;
            const mode = modeSelect.value;
            const emptyIndices = boardState.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
            if (emptyIndices.length === 0) return;

            let bestMove;
            if (mode === 'ai-easy') {
                bestMove = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            } else if (mode === 'ai-med') {
                bestMove = Math.random() < 0.5 ? getBestMove() : emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            } else {
                bestMove = getBestMove();
            }

            makeMove(bestMove, 'O');
        }

        function getBestMove() {
            const emptyIndices = boardState.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
            
            // 1. Check instant win for O
            for (let idx of emptyIndices) {
                const temp = [...boardState];
                temp[idx] = 'O';
                if (checkWin(temp, 'O')) return idx;
            }

            // 2. Block instant win for X
            for (let idx of emptyIndices) {
                const temp = [...boardState];
                temp[idx] = 'X';
                if (checkWin(temp, 'X')) return idx;
            }

            // 3. Minimax (For 3x3) or Heuristic evaluation (For larger sizes)
            if (boardSize === 3) {
                let bestScore = -Infinity;
                let move = emptyIndices[0];
                for (let idx of emptyIndices) {
                    boardState[idx] = 'O';
                    let score = minimax(boardState, 0, false, -Infinity, Infinity);
                    boardState[idx] = '';
                    if (score > bestScore) {
                        bestScore = score;
                        move = idx;
                    }
                }
                return move;
            } else {
                // Fallback to center preference for larger boards
                const center = Math.floor(boardState.length / 2);
                if (boardState[center] === '') return center;
                return emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            }
        }

        function minimax(board, depth, isMaximizing, alpha, beta) {
            if (checkWin(board, 'O')) return 10 - depth;
            if (checkWin(board, 'X')) return depth - 10;
            if (board.every(cell => cell !== '')) return 0;
            if (depth >= 6) return 0; // Depth limit for performance

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let i = 0; i < board.length; i++) {
                    if (board[i] === '') {
                        board[i] = 'O';
                        let evaluation = minimax(board, depth + 1, false, alpha, beta);
                        board[i] = '';
                        maxEval = Math.max(maxEval, evaluation);
                        alpha = Math.max(alpha, evaluation);
                        if (beta <= alpha) break;
                    }
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let i = 0; i < board.length; i++) {
                    if (board[i] === '') {
                        board[i] = 'X';
                        let evaluation = minimax(board, depth + 1, true, alpha, beta);
                        board[i] = '';
                        minEval = Math.min(minEval, evaluation);
                        beta = Math.min(beta, evaluation);
                        if (beta <= alpha) break;
                    }
                }
                return minEval;
            }
        }

        // --- State Management Helpers ---
        function updateScores() {
            document.getElementById('score-x').textContent = scores.X;
            document.getElementById('score-o').textContent = scores.O;
            document.getElementById('score-ties').textContent = scores.ties;
        }

        function updateUndoBtn() {
            btnUndo.disabled = history.length === 0 || (!gameActive && checkWin(boardState, 'X') === null && checkWin(boardState, 'O') === null);
        }

        btnUndo.addEventListener('click', () => {
            if (history.length === 0) return;
            
            const isAI = modeSelect.value.startsWith('ai');
            const undoCount = isAI && history.length >= 2 ? 2 : 1;

            for (let i = 0; i < undoCount; i++) {
                if (history.length > 0) history.pop();
            }

            if (history.length > 0) {
                boardState = [...history[history.length - 1].board];
                currentPlayer = history[history.length - 1].player === 'X' ? 'O' : 'X';
            } else {
                boardState = Array(boardSize * boardSize).fill('');
                currentPlayer = 'X';
            }

            gameActive = true;
            statusEl.textContent = `Player ${currentPlayer}'s Turn`;
            renderBoard();
            updateUndoBtn();
        });

        btnRestart.addEventListener('click', initGame);
        modeSelect.addEventListener('change', () => { scores = { X: 0, O: 0, ties: 0 }; updateScores(); initGame(); });
        sizeSelect.addEventListener('change', () => { scores = { X: 0, O: 0, ties: 0 }; updateScores(); initGame(); });

        btnSound.addEventListener('click', () => {
            audio.enabled = !audio.enabled;
            btnSound.innerHTML = audio.enabled 
                ? `<i data-lucide="volume-2" class="w-5 h-5"></i>` 
                : `<i data-lucide="volume-x" class="w-5 h-5"></i>`;
            lucide.createIcons();
        });

        btnTheme.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            const body = document.getElementById('app-body');
            const card = document.getElementById('main-card');
            
            if (isDarkMode) {
                body.className = "bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300";
                card.className = "max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700 transition-colors duration-300";
                btnTheme.innerHTML = `<i data-lucide="sun" class="w-5 h-5"></i>`;
            } else {
                body.className = "bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300";
                card.className = "max-w-md w-full bg-white rounded-2xl shadow-2xl p-6 border border-slate-200 transition-colors duration-300";
                btnTheme.innerHTML = `<i data-lucide="moon" class="w-5 h-5"></i>`;
            }
            lucide.createIcons();
        });

        // Initialize App
        initGame();
    </script>
</body>
</html>
